<!-- editar-clase.html -->
<!DOCTYPE html>
<html lang="es" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Clase</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="/Principal.css">
</head>
<body>

<div class="edit-class-page">

    <!-- CARD -->
    <div class="edit-class-card">

        <!-- HEADER -->
        <div class="edit-header">

            <div>
                <span class="edit-badge">
                    Gestión de Clase
                </span>

                <h1>
                    Apuntate a nueva clase
                </h1>
            </div>

        </div>

        <!-- FORM -->
        <form>

            <div class="row g-4">


                <div class="col-md-6">
                    <label class="edit-label">
                        Entreanador
                    </label>
                    <select class="form-select edit-input">

                        <option selected disabled>
                            Selecciona un entrenador
                        </option>

                        <option value="1">
                            Full Body Training
                        </option>

                        <option value="2">
                            Yoga Relax
                        </option>

                        <option value="3">
                            HIIT Cardio
                        </option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="edit-label">
                        Clases disponibles
                    </label>
                    <select class="form-select edit-input">

                        <option selected disabled>
                            Selecciona una clase
                        </option>

                        <option value="1">
                            Full Body Training
                        </option>

                        <option value="2">
                            Yoga Relax
                        </option>

                        <option value="3">
                            HIIT Cardio
                        </option>
                    </select>
                </div>

            </div>

            <!-- BOTONES -->
            <div class="edit-buttons">

                <button type="button" class="btn cancel-btn">
                    Cancelar
                </button>

                <button type="submit" class="btn save-btn">
                    Guardar Cambios
                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
