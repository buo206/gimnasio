<!-- editar-clase.html -->
<!DOCTYPE html>
<html lang="es" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Clase</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="/Principal.css">
</head>
<body>

<div class="edit-class-page">

    <!-- CARD -->
    <div class="edit-class-card">
        <!-- HEADER -->
        <div class="edit-header">

            <div>
                <span class="edit-badge">
                    Gestión de Clase
                </span>

                <h1>
                    Apuntate a nueva clase
                </h1>
            </div>

        </div>

        <!-- FORM -->
        <form>

            <div class="row g-4">
                <form th:action="@{/apuntarse}" method="get" class="col-md-6">

                    <select class="form-select edit-input" name="idClase">
                        <label class="edit-label">
                            Clases disponibles
                        </label>
                        <option
                                th:each="clase : ${listaClases}"
                                th:value="${clase.idClase()}"
                                th:text="${clase.idClase()} + ' - ' + ${clase.titulo()} + ' | ' + ${clase.fecha()} + ' | ' + ${clase.hora()}">
                        </option>
                    </select>

                    <p th:if="${error}" th:text="${error}" style="color:red"></p>

                    <button class="btn btn-orange" type="submit">
                        <a th:href="@{'/registroClase/'+${}}" style="text-decoration: none; color: white;" onclick="return confirm('¿ Seguro que quiere apuntarse a esta clase ?');">Guardar</a>
                    </button>
                </form>
            </div>



            <!-- BOTONES -->
            <div class="edit-buttons">

                <button type="button" class="btn cancel-btn">
                    Cancelar
                </button>

                <button class="btn btn-orange">
                    <a th:href="@{'/registroClase/'+${}}" style="text-decoration: none; color: white;" onclick="return confirm('¿ Seguro que quiere apuntarse a esta clase ?');">Guardar</a>
                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
