<!-- editar-clase.html -->
<!DOCTYPE html>
<html lang="es" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Clase</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="/Principal.css">
</head>
<body>

<div class="edit-class-page">

    <!-- CARD -->
    <div class="edit-class-card">
        <!-- HEADER -->
        <div class="edit-header">

            <div>
                <span class="edit-badge">
                    Gestión de Clase
                </span>

                <h1>
                    Apuntate a nueva clase
                </h1>
            </div>

        </div>

        <!-- FORM -->
        <form th:action="@{/registroClase/crear/{idUsuario}(idUsuario=${idUsuario})}" th:object="${registroClase}" method="post">
            <input type="hidden" th:field="*{idRegistroClase}">
            <input type="hidden" th:field="*{idRegistroBono}">
            <input type="hidden" th:field="*{estado}">

            <div class="row g-4">
                <div class="col-md-6">
                    <label class="edit-label">
                        Clases disponibles
                    </label>
                    <select class="form-select edit-input" th:field="*{idClase}" id="seleccionado" required>

                        <option
                            th:each="clase : ${listaClases}"
                            th:value="${clase.idClase()}"
                            th:text="${clase.idClase()} + ' - ' + ${clase.titulo()} + ' | ' + ${clase.fecha()} + ' | ' + ${clase.hora()}">
                        </option>
                    </select>
                </div>
                <p th:if="${error}" th:text="${error}" style="color:red"></p>
                <p th:if="${errorMensaje}" th:text="${errorMensaje}" style="color:red"></p>
                <p th:if="${mensaje}" th:text="${mensaje}" style="color:green"></p>

                <button class="btn btn-orange" type="submit" onclick="return confirm('¿ Seguro que quiere apuntarse a esta clase ?');">
                    Guardar
                </button>
            </div>

            <!-- BOTONES -->
            <div class="edit-buttons">

                <button type="button" class="btn cancel-btn" >
                    <a th:href="@{/registroClase/listaClasesUsuario}" style="text-decoration: none; color: white;" >Cancelar </a>
                </button>
            </div>

        </form>

    </div>

</div>

</body>
</html>
