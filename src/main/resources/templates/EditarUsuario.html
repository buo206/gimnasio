<!DOCTYPE html>
<html lang="es" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Perfil</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/Principal.css">
</head>
<body>

<div class="edit-class-page">
    <div class="edit-class-card">

        <div class="edit-header">
            <div>
                <span class="edit-badge">Mi Perfil</span>
                <h1>Modificar parámetros del entrenador</h1>
            </div>
        </div>

        <div th:if="${errorMensaje}" class="alert alert-danger" role="alert" style="margin-top: 15px;">
            <span th:text="${errorMensaje}"></span>
        </div>

        <form th:action="@{/usuario/guardarPerfil}" th:object="${usuario}" method="post">

            <input type="hidden" th:field="*{idUsuario}" />

            <div class="row g-4">
                <div class="col-md-6">
                    <label class="edit-label" for="nombre">Nombre</label>
                    <input type="text" th:field="*{nombre}" class="form-control edit-input" id="nombre" required maxlength="100" />
                </div>

                <div class="col-md-6">
                    <label class="edit-label" for="apellidos">Apellidos</label>
                    <input type="text" th:field="*{apellidos}" class="form-control edit-input" id="apellidos" required maxlength="100" />
                </div>

                <div class="col-md-12">
                    <label class="edit-label" for="direccion">Dirección de Residencia</label>
                    <input type="text" th:field="*{direccion}" class="form-control edit-input" id="direccion" maxlength="100" />
                </div>

                <div class="col-md-6">
                    <label class="edit-label" for="email">Correo Electrónico</label>
                    <input type="email" th:field="*{email}" class="form-control edit-input" id="email" required maxlength="255" />
                </div>

                <div class="col-md-6">
                    <label class="edit-label" for="telefono">Teléfono de Contacto</label>
                    <input type="text" th:field="*{telefono}" class="form-control edit-input" id="telefono" maxlength="14" />
                </div>
                <div class="col-md-6">
                    <label class="edit-label" for="dni">DNI</label>
                    <input type="text" th:field="*{dni}" class="form-control edit-input" id="dni" maxlength="9" />
                </div>

                <div class="col-md-12">
                    <label class="edit-label" for="password">Contraseña de Acceso</label>
                    <input type="password" th:field="*{password}" class="form-control edit-input" id="password" required maxlength="50" placeholder="Introduce tu nueva contraseña o la actual" />
                </div>
            </div>

            <div class="edit-buttons mt-4">
                <button type="button" class="btn cancel-btn" style="background-color: #6c757d;">
                    <a th:href="@{/usuario/home}" style="color: white; text-decoration: none">Cancelar</a>
                </button>

                <button type="submit" class="btn btn-orange" style="color: white;"
                        onclick="return confirm('¿Seguro que quiere guardar los cambios de su perfil?');">
                    Guardar Cambios
                </button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
