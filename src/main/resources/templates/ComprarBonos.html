<!DOCTYPE html>
<html lang="es" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bonos Gym</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/Principal.css">
</head>
<body>

<div class="bonos-page">

    <div class="bonos-header">
        <h1>Elige tu bono</h1>
        <p>Accede a nuestros planes y mejora tu entrenamiento</p>
    </div>

    <div class="container">

        <div class="row g-4 justify-content-center">

            <!-- BONO BASICO -->
            <div class="col-md-5">

                <div class="bono-card">

                    <div class="bono-title">
                        Bono Tipo 1
                    </div>

                    <div class="bono-price">
                        15€
                    </div>

                    <ul class="bono-list">
                        <li>✔ Acceso a las clases grupales</li>
                        <li>✔ 5 clases</li>
                        <li>✔ Horario flexible</li>
                        <li>✔ Clases dirigidas</li>
                    </ul>

                    <form th:action="@{/registroUsuarioBono/comprarTipo1}" method="post">
                        <button type="submit" class="btn bono-btn">
                            Comprar
                        </button>
                    </form>

                </div>

            </div>

            <!-- BONO PREMIUM -->
            <div class="col-md-5">

                <div class="bono-card premium">

                    <div class="bono-title">
                        Bono Tipo 2
                    </div>

                    <div class="bono-price">
                        80€
                    </div>

                    <ul class="bono-list">
                        <li>✔ Clases personales</li>
                        <li>✔ 10 sesiones</li>
                        <li>✔ Clases dirigidas </li>
                        <li>✔ Entrenador personal</li>
                    </ul>

                    <form th:action="@{/registroUsuarioBono/comprarTipo2}" method="post">
                        <button type="submit" class="btn bono-btn">
                            Comprar
                        </button>
                    </form>
                </div>
            </div>
        </div>

    </div>
    <div class="bonos-header">
        <a th:href="@{/usuario/home}" class="btn bono-btn" style="margin: 2%">
            Volver
        </a>
    </div>

</div>

</body>
</html>
